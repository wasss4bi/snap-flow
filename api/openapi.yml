    /images/{filename}:
        get:
            description: Original bytes for a visible owned image; MIME type derives from filename extension.
            operationId: readImage
            parameters:
                - description: Filename returned by upload (UUID plus extension), not the metadata ID.
                  example: 00000000-0000-4000-8000-000000000001.jpg
                  in: path
                  name: filename
                  required: true
                  schema:
                    minLength: 1
                    type: string
                - description: Optional 1–64 ASCII letters, digits, underscore or dash. Invalid/missing values are replaced by a UUID, not rejected.
                  in: header
                  name: X-Request-ID
                  required: false
                  schema:
                    maxLength: 64
                    type: string
            responses:
                "200":
                    content:
                        application/octet-stream:
                            schema:
                                format: binary
                                type: string
                        image/gif:
                            schema:
                                format: binary
                                type: string
                        image/jpeg:
                            schema:
                                format: binary
                                type: string
                        image/png:
                            schema:
                                format: binary
                                type: string
                    description: Decrypted binary bytes
                    headers:
                        X-Request-ID:
                            description: Accepted or generated correlation identifier
                            schema:
                                type: string
                "401":
                    $ref: '#/components/responses/JwtUnauthorized'
                "404":
                    description: Empty response if not owned/not found, database lookup failed, or storage read/decryption failed.
                    headers:
                        X-Request-ID:
                            description: Accepted or generated correlation identifier
                            schema:
                                type: string
            security:
                - JwtBearer: []
                - JwtCookie: []
            summary: Read decrypted original
            tags:
                - Images
    /logout:
        post:
            description: Revokes the current JWT until it expires and clears the authentication cookie. Other sessions remain active. Authorization takes precedence over the cookie.
            operationId: logout
            parameters:
                - description: Optional 1–64 ASCII letters, digits, underscore or dash. Invalid/missing values are replaced by a UUID, not rejected.
                  in: header
                  name: X-Request-ID
                  required: false
                  schema:
                    maxLength: 64
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                message: Logout successful
                                success: true
                            schema:
                                $ref: '#/components/schemas/DeleteResponse'
                    description: Cookie cleared
                    headers:
                        Set-Cookie:
                            description: Expired auth_token cookie
                            schema:
                                type: string
                        X-Request-ID:
                            description: Accepted or generated correlation identifier
                            schema:
                                type: string
                "401":
                    $ref: '#/components/responses/JwtUnauthorized'
            security:
                - JwtBearer: []
                - JwtCookie: []
            summary: Clear the authentication cookie
            tags:
                - Authentication

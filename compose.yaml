name: snapflow

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE is required}
  env_file: .env
  environment: &app-env
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
    DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    RABBITMQ_USERNAME: ${RABBITMQ_USER:?RABBITMQ_USER is required}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    REDIS_ADDR: redis:6379
    STORAGE_DRIVER: s3
    STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?STORAGE_ENCRYPTION_KEY is required}
    STORAGE_ENCRYPTION_KEY_VERSION: ${STORAGE_ENCRYPTION_KEY_VERSION:-v1}
    STORAGE_PREVIOUS_ENCRYPTION_KEYS: ${STORAGE_PREVIOUS_ENCRYPTION_KEYS:-}
    STORAGE_LEGACY_ENCRYPTION_KEY: ${STORAGE_LEGACY_ENCRYPTION_KEY:-}
    STORAGE_WRITE_LEGACY: ${STORAGE_WRITE_LEGACY:-false}
    SERVER_HOST: 0.0.0.0
    SERVER_PORT: "8080"
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    ADMIN_NAME: ${ADMIN_NAME:?ADMIN_NAME is required}
    ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    TWS_ACCESS_KEY_ID: ${TWS_ACCESS_KEY_ID:?TWS_ACCESS_KEY_ID is required}
    TWS_SECRET_ACCESS_KEY: ${TWS_SECRET_ACCESS_KEY:?TWS_SECRET_ACCESS_KEY is required}
    TWS_BUCKET: ${TWS_BUCKET:?TWS_BUCKET is required}
    TWS_DEFAULT_REGION: ${TWS_DEFAULT_REGION:?TWS_DEFAULT_REGION is required}
    TWS_ENDPOINT: ${TWS_ENDPOINT:?TWS_ENDPOINT is required}
    SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
    SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
    SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
    METRICS_ADDR: ":9091"
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.11-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.2-management@sha256:c1e33461287f4c53049ce525575f0df77b2a00a88e2593776afbb6c1489bdb81
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: [CMD, gosu, rabbitmq, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 10s
      retries: 30
    stop_grace_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4.8-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app
    command: [/app/migrate]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    <<: *app
    command: [/app/server]
    ports:
      - '127.0.0.1:${HTTP_PORT:?HTTP_PORT is required}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    <<: *app
    command: [/app/worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  outbox:
    <<: *app
    command: [/app/outbox]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

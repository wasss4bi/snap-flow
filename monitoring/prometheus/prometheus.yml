global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: snapflow
    static_configs:
      - targets: ["server:9091", "worker:9091", "outbox:9091"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels: {namespace: snapflow}
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: dependency-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["postgres:5432", "redis:6379", "alertbridge:9094", "alertmanager:9093"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

name: snapflow-local

x-app-environment: &app-environment
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: snap_flow
  DB_USERNAME: snap_flow
  DB_PASSWORD: ${POSTGRES_PASSWORD:-snapflow-local-password}
  DB_SSLMODE: disable
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: snap_flow
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-rabbit-password}
  RABBITMQ_VHOST: /
  RABBITMQ_QUEUE_PREFIX: snapflow.v2
  RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-4}
  RABBITMQ_MAX_ATTEMPTS: "3"
  RABBITMQ_RETRY_DELAY_MS: "5000"
  RABBITMQ_PUBLISH_TIMEOUT_MS: "3000"
  REDIS_ADDR: redis:6379
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-no-reply@example.test}
  SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  LOCAL_STORAGE_PATH: /app/data/storage
  LOCAL_STORAGE_KEY: ${LOCAL_STORAGE_KEY:-local-development-key-change-before-use}
  JWT_SECRET: ${JWT_SECRET:-}
  SESSION_SECRET: ${SESSION_SECRET:-local-session-key-change-before-use}
  TWS_ACCESS_KEY_ID: ${TWS_ACCESS_KEY_ID:-}
  TWS_SECRET_ACCESS_KEY: ${TWS_SECRET_ACCESS_KEY:-}
  TWS_BUCKET: ${TWS_BUCKET:-}
  TWS_DEFAULT_REGION: ${TWS_DEFAULT_REGION:-ru-1}
  TWS_ENDPOINT: ${TWS_ENDPOINT:-}
  S3_REQUEST_TIMEOUT_SECONDS: ${S3_REQUEST_TIMEOUT_SECONDS:-30}

x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-snapflow-local}-app
  environment: *app-environment

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snap_flow
      POSTGRES_USER: snap_flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snapflow-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U snap_flow -d snap_flow"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: snap_flow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-rabbit-password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [CMD, gosu, rabbitmq, rabbitmq-diagnostics, -q, ping]
      interval: 3s
      timeout: 10s
      retries: 30
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  migrate:
    <<: *app
    command: [/app/migrate]
    environment:
      <<: *app-environment
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: [/app/server]
    environment:
      <<: *app-environment
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      GIN_MODE: release
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - encrypted_images:/app/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    <<: *app
    command: [/app/worker]
    volumes:
      - encrypted_images:/app/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  outbox:
    <<: *app
    command: [/app/outbox]
    volumes:
      - encrypted_images:/app/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tests
    environment:
      <<: *app-environment
      DB_DATABASE: snap_flow_test
      RUN_POSTGRES_TESTS: "1"
      RUN_RABBIT_TESTS: "1"
    volumes:
      - test_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: [go, test, -count=1, -timeout=120s, -cover, ./...]

  smoke:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tests
    environment:
      <<: *app-environment
      E2E_BASE_URL: http://server:8080
      RUN_E2E: "1"
    volumes:
      - encrypted_images:/app/data/storage:ro
      - test_cache:/root/.cache/go-build
    depends_on:
      server:
        condition: service_healthy
      worker:
        condition: service_started
      outbox:
        condition: service_started
    command: [go, test, -tags=integration, -count=1, -timeout=120s, -v, ./tests/e2e]

  fixtures:
    profiles: [test]
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: snap_flow
      PGDATABASE: snap_flow
      PGPASSWORD: ${POSTGRES_PASSWORD:-snapflow-local-password}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    volumes:
      - ./tools/api/fixtures.sql:/fixtures.sql:ro
    entrypoint: [/bin/sh, -ec]
    command: ['test "$$STORAGE_DRIVER" = local || { echo "Fixtures require local storage"; exit 1; }; exec psql -v ON_ERROR_STOP=1 -f /fixtures.sql']
    depends_on:
      migrate:
        condition: service_completed_successfully

  api-tools:
    profiles: [test]
    build:
      context: tools/api
    working_dir: /work/api/bruno
    volumes:
      - .:/work:ro
      - ./docs/api:/output
    environment:
      PGHOST: postgres
      PGUSER: snap_flow
      PGDATABASE: snap_flow
      PGPASSWORD: ${POSTGRES_PASSWORD:-snapflow-local-password}
      BASE_URL: http://server:8080
    command: [sh, /work/tools/api/run-bruno.sh]

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  encrypted_images:
  test_cache:
